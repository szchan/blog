app = "blog-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.prod"

[env]
  CORS_ORIGINS = '["https://your-blog.vercel.app"]'
  SECURE_COOKIES = "true"
  UPLOAD_DIR = "uploads"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[mounts]
  source = "uploads"
  destination = "/app/uploads"
